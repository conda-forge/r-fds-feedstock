{% set version = "1.9" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-fds
  version: "{{ version|replace("-", "_") }}"

source:
  url:
    - {{ cran_mirror }}/src/contrib/fds_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/fds/fds_{{ version }}.tar.gz
  sha256: 1d86f83aa105abd3073e5cdac84da935e12183def93df6c5ed7b871d51df3b0e

build:
  number: 0
  noarch: generic
  rpaths:
    - lib/R/lib/
    - lib/
  missing_dso_whitelist:
    - '*/R.dll'        # [win]
    - '*/Rblas.dll'    # [win]
    - '*/Rlapack.dll'  # [win]

requirements:
  build:
    - {{ posix }}zip               # [win]
  host:
    - r-base
    - r-rcurl
    - r-rainbow
  run:
    - r-base
    - r-rcurl
    - r-rainbow

test:
  commands:
    - $R -e "library('fds')"           # [not win]
    - "\"%R%\" -e \"library('fds')\""  # [win]

about:
  home: https://CRAN.R-project.org/package=fds
  license: GPL-2.0-or-later
  summary: Functional data sets.
  license_family: GPL2
  license_file:
    - {{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-2

extra:
  recipe-maintainers:
    - conda-forge/r

